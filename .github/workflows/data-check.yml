# Weekly data check (session 22c): runs `check` against upstream metadata
# and maintains ONE open issue when updates are available; closes it when
# everything is up to date. Nothing deploys from GitHub.
name: data-check

on:
  schedule:
    # Weekly, off the hour to spread GitHub's scheduled load
    - cron: '17 4 * * 2'
  workflow_dispatch:

# Least privilege (session 22c): read-only by default; only this job
# gains issues: write to maintain the single issue.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job split (review hardening, mirroring data-refresh.yml): this job
    # runs project code against untrusted upstream data, so it holds NO
    # write permission at all; the issue-maintaining job below gets
    # issues: write but runs NO project code.
    permissions:
      contents: read
    steps:
      # SHAs from `git ls-remote https://github.com/<repo> refs/tags/<tag>`
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Project code runs here with upstream data; never leave the
          # token in git config (it could be exfiltrated by a malicious
          # postinstall script or compromised dependency).
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the data check
        env:
          # makeFetcher sends this token ONLY to api.github.com hosts
          # (unit-tested); it is never echoed or logged.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @vliegvuil/data-build run check
      - name: Build the issue body from the status file
        # Upstream strings never enter a run: script; the body is built
        # in tested TypeScript and passed via a file.
        run: pnpm --filter @vliegvuil/data-build exec tsx src/issue-body.ts ../data-build/status/data-status.json ../data-build/status/issue-body.md
      - name: Stage the artifact files into one dedicated directory
        # LAYOUT FIX (review finding): actions/upload-artifact v4 uses
        # the LEAST COMMON ANCESTOR of multiple paths as the artifact
        # root. Uploading data-build/status/{data-status.json,issue-body.md}
        # directly flattens them to the artifact ROOT (data-status.json,
        # issue-body.md) — the maintain-issue job then found no
        # data-build/status/... file, and the old script treated grep's
        # exit 2 on the MISSING file as "no match", silently closing the
        # "Data updates available" issue. Copying into ONE directory and
        # uploading that single path pins the layout explicitly — no LCA
        # rule applies with a single path. Do NOT "simplify" this back to
        # the two-file multi-line list.
        run: |
          set -eu
          mkdir -p check-output
          cp data-build/status/data-status.json check-output/
          cp data-build/status/issue-body.md check-output/
      - name: Upload the status and issue body as an artifact
        # The second job (issues: write) runs NO project code; it only
        # needs these two files, produced here by tested TypeScript.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-output
          path: check-output
          retention-days: 7
          if-no-files-found: error

  maintain-issue:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can write; it runs NO project code: git, gh, bash only.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: check-output
          # The check job uploads the single check-output/ directory, so
          # the download lands at check-output/ — the layout is explicit
          # and does not depend on the LCA rule (see the check job).
          path: check-output
      - name: Create or update the single issue (or close when up to date)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_FILE: check-output/data-status.json
          BODY_FILE: check-output/issue-body.md
        run: |
          set -eu
          # Pure bash + gh; no upstream data interpolated into this script.
          # This job has NO checkout (it must not run project code), so gh
          # cannot infer the repository from a git remote — every gh call
          # passes --repo "$GITHUB_REPOSITORY" (an env GitHub sets on every
          # job; not upstream data). Without it the dispatch run failed
          # with "failed to run git: fatal: not a git repository".
          label="data-updates"
          title="Data updates available"
          # FAIL CLOSED (review fix): a missing/empty status or body file
          # must ABORT, not silently take the "up to date" branch — that
          # once closed the open issue on a bad artifact layout.
          if ! test -s "$STATUS_FILE"; then
            echo "status file missing or empty: $STATUS_FILE" >&2
            exit 1
          fi
          if ! test -s "$BODY_FILE"; then
            echo "body file missing or empty: $BODY_FILE" >&2
            exit 1
          fi
          # grep exit codes are distinguished: 0 = match, 1 = no match,
          # 2+ = error (e.g. unreadable file) — only 1 may fall through
          # to the "up to date" branch.
          if grep -q '"status": "update-available"\|"status": "review-due"' "$STATUS_FILE"; then
            grep_rc=0
          else
            grep_rc=$?
            if [ "$grep_rc" -ne 1 ]; then
              echo "grep on $STATUS_FILE failed with exit $grep_rc" >&2
              exit 1
            fi
          fi
          if [ "$grep_rc" -eq 0 ]; then
            issue_url="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json url --jq '.[0].url')"
            if [ -n "$issue_url" ]; then
              gh issue edit --repo "$GITHUB_REPOSITORY" "$issue_url" --body-file "$BODY_FILE"
              echo "Updated existing issue: $issue_url"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" --body-file "$BODY_FILE"
              echo "Created new issue"
            fi
          else
            issue_url="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json url --jq '.[0].url')"
            if [ -n "$issue_url" ]; then
              gh issue close --repo "$GITHUB_REPOSITORY" "$issue_url" --comment "All sources are up to date; closing. This issue reopens automatically when an update is detected."
              echo "Closed issue: $issue_url"
            else
              echo "All sources up to date; no open issue to close."
            fi
          fi
