name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (session 22c): read-only by default; every job here
# only needs the checkout, so no job overrides this.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service-worker precache test asserts against web/dist/sw.js
      - run: pnpm --filter @vliegvuil/web build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm build unconditionally rewrites sources.json (lastUpdated),
      # web/public/data/*.json AND web/public/noise-contours.geojson (the
      # data-build step regenerates all its outputs; see AGENTS.md); those
      # diffs are build output, never committed from here — data reaches
      # the repo only through data-refresh PRs. Reset them, then demand a
      # clean tree: any other modified tracked file, or any new untracked
      # file the build emitted, means the build is not reproducible.
      # git status --porcelain (not git diff) so untracked files count.
      - name: Fail if the build modifies tracked files
        run: |
          git checkout -- sources.json web/public/data web/public/noise-contours.geojson
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Session 22c bugfix guard: catches $GITHUB_* typos in run: scripts
      # (actionlint does not check shell variable existence).
      - run: scripts/check-workflow-env.sh
      # actionlint (workflow linter), downloaded as a pinned binary and
      # verified by the checksum from the release's checksums file — no
      # third-party action involved. v1.7.12 checksum verified against
      # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
      - name: Install actionlint v1.7.12 (checksum-pinned)
        run: |
          set -eu
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version
      - run: ./actionlint
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:sources

  validate-caddyfile:
    runs-on: ubuntu-latest
    # Compiles the whole Caddy + modules tree; slower than the JS jobs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Textual guard for the error-log IP scrub (needs no caddy binary;
      # runs negative self-tests too). See scripts/verify-caddy-scrub.sh.
      - run: scripts/verify-caddy-scrub.sh Caddyfile
      # The Caddyfile uses the rate_limit (mholt/caddy-ratelimit) and cache
      # (caddyserver/cache-handler + otter storage) modules, so it must be
      # validated with a custom binary. See docs/deploy.md.
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24'
          cache: false
      # Pinned so the fmt gate below cannot drift when a new Caddy release
      # changes canonical formatting, and so validate runs against the same
      # version the VPS builds. Single source of truth for BOTH this job and
      # scripts/vps-caddy-update.sh: scripts/caddy-versions.env (see also
      # docs/deploy.md 9). Latest releases at pin time are recorded there.
      - name: Load pinned Caddy versions
        # Only the VAR=value lines; GITHUB_ENV has no comment syntax.
        run: |
          grep -E '^[A-Z_]+=' scripts/caddy-versions.env >> "$GITHUB_ENV"
      - run: go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"
      - run: xcaddy build "${CADDY_VERSION}"
          --with "github.com/mholt/caddy-ratelimit@${CADDY_RATELIMIT_VERSION}"
          --with "github.com/caddyserver/cache-handler@${CADDY_CACHE_HANDLER_VERSION}"
          --with "github.com/darkweak/storages/otter/caddy@${CADDY_OTTER_VERSION}"
          --output ./caddy-custom
      - run: ./caddy-custom validate --config Caddyfile
      # Formatting gate: fail when caddy fmt would change the Caddyfile.
      # Per the caddy fmt docs, the command "will exit with code 1 if there
      # are any differences"; --diff prefixes every line (two spaces for
      # unchanged, -/+ for changed), so its output is non-empty even when
      # the file is already formatted - gate on the exit code, and print
      # the diff in the job log on failure. Never use --overwrite in CI.
      - run: |
          if ! ./caddy-custom fmt --diff Caddyfile; then
            echo "::error::Caddyfile formatting drift detected; run 'caddy fmt --overwrite Caddyfile' locally and commit the result"
            exit 1
          fi
          echo "Caddyfile formatting OK"
