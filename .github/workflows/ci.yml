name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (session 22c): read-only by default; every job here
# only needs the checkout, so no job overrides this.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service-worker precache test asserts against web/dist/sw.js
      - run: pnpm --filter @vliegvuil/web build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Session 22c bugfix guard: catches $GITHUB_* typos in run: scripts
      # (actionlint does not check shell variable existence).
      - run: scripts/check-workflow-env.sh
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:sources

  validate-caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Caddyfile uses the rate_limit (mholt/caddy-ratelimit) and cache
      # (caddyserver/cache-handler + otter storage) modules, so it must be
      # validated with a custom binary. See docs/deploy.md.
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24'
          cache: false
      # Pinned so the fmt gate below cannot drift when a new Caddy release
      # changes canonical formatting, and so validate runs against the same
      # version the VPS builds (keep in sync with scripts/vps-caddy-update.sh
      # and docs/deploy.md 9). Latest releases at pin time:
      # caddy https://github.com/caddyserver/caddy/releases/latest (v2.11.7)
      # caddy-ratelimit https://github.com/mholt/caddy-ratelimit/tags (v0.1.0, only tag)
      # cache-handler https://github.com/caddyserver/cache-handler/releases/latest (v0.17.0)
      # storages https://github.com/darkweak/storages/releases (v0.0.20)
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - run: xcaddy build v2.11.7
          --with github.com/mholt/caddy-ratelimit@v0.1.0
          --with github.com/caddyserver/cache-handler@v0.17.0
          --with github.com/darkweak/storages/otter/caddy@v0.0.20
          --output ./caddy-custom
      - run: ./caddy-custom validate --config Caddyfile
      # Formatting gate: fail when caddy fmt would change the Caddyfile.
      # Gated on the diff being empty (not on an exit code: fmt exits 0
      # either way); the diff is printed in the job log on failure.
      # Never use --overwrite in CI.
      - run: |
          DIFF="$(./caddy-custom fmt --diff Caddyfile)"
          if [ -n "$DIFF" ]; then
            echo "Caddyfile formatting drift detected; run 'caddy fmt' locally:"
            echo "$DIFF"
            exit 1
          fi
          echo "Caddyfile formatting OK (no diff)"
